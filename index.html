<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SKY INN Jambi</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial, sans-serif;
  background:#f4f1eb;
  color:#222;
}

/* NAVBAR */
nav{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:99;
  padding:18px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(10px);
}

.logo{
  color:white;
  font-size:22px;
  font-weight:bold;
  letter-spacing:5px;
}

nav a{
  color:white;
  text-decoration:none;
  margin-left:22px;
  font-size:12px;
  letter-spacing:1px;
}

/* HERO */
.hero{
  height:100vh;
  min-height:600px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:white;

  background:
  linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.65)),
  linear-gradient(135deg,#444,#111);
}

.hero small{
  color:#d7b56d;
  letter-spacing:6px;
}

.hero h1{
  font-size:clamp(55px,12vw,110px);
  letter-spacing:10px;
  margin:15px 0;
}

.hero p{
  font-size:16px;
  color:#ddd;
  line-height:1.7;
}

.btn{
  display:inline-block;
  margin-top:30px;
  padding:14px 30px;
  border:1px solid #d7b56d;
  color:white;
  text-decoration:none;
  letter-spacing:2px;
}

/* SECTION */
section{
  padding:90px 7%;
}

.title{
  text-align:center;
  margin-bottom:50px;
}

.title small{
  color:#a47d3c;
  letter-spacing:4px;
}

.title h2{
  font-size:38px;
  font-weight:500;
  margin-top:10px;
}

/* ABOUT */
.about{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:55px;
  align-items:center;
}

.photo{
  height:430px;
  background:
  linear-gradient(135deg,#d8d1c5,#81796c);
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  text-align:center;
  font-size:15px;
  letter-spacing:2px;
}

.about h2{
  font-size:35px;
  margin-bottom:20px;
}

.about p{
  color:#666;
  line-height:1.9;
  margin-bottom:15px;
}

/* FEATURES */
.features{
  background:#e8e2d8;
}

.cards{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.card{
  background:white;
  padding:35px 25px;
  text-align:center;
  transition:.3s;
}

.card:hover{
  transform:translateY(-7px);
}

.icon{
  font-size:40px;
  margin-bottom:20px;
}

.card h3{
  margin-bottom:12px;
}

.card p{
  color:#777;
  line-height:1.6;
  font-size:14px;
}

/* GALLERY */
.gallery{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.gallery-photo{
  height:280px;
  background:linear-gradient(135deg,#bdb5a8,#5d574e);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  text-align:center;
}

/* LOCATION */
.location{
  max-width:850px;
  margin:auto;
  text-align:center;
}

.location p{
  color:#666;
  line-height:1.8;
}

/* FOOTER */
footer{
  background:#151515;
  color:white;
  text-align:center;
  padding:55px 20px;
}

footer h2{
  letter-spacing:6px;
}

footer p{
  color:#888;
  margin-top:12px;
  font-size:13px;
}

/* MOBILE */
@media(max-width:700px){

  nav{
    padding:16px;
  }

  .logo{
    font-size:17px;
  }

  nav a{
    margin-left:8px;
    font-size:9px;
  }

  .hero h1{
    font-size:52px;
    letter-spacing:6px;
  }

  .hero p{
    font-size:14px;
    padding:0 25px;
  }

  section{
    padding:70px 6%;
  }

  .about{
    grid-template-columns:1fr;
  }

  .about h2{
    font-size:30px;
  }

  .cards,
  .gallery{
    grid-template-columns:1fr;
  }

  .photo{
    height:320px;
  }
}
</style>
</head>

<body>

<nav>
  <div class="logo">SKY INN</div>

  <div>
    <a href="#home">HOME</a>
    <a href="#about">ABOUT</a>
    <a href="#rooms">ROOMS</a>
  </div>
</nav>
