<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKY INN Jambi — Urban & Classic</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#0b0b0b;
  color:#fff;
}

nav{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:100;
  padding:22px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.1);
}

.logo{
  font-size:22px;
  letter-spacing:6px;
  font-weight:bold;
}

nav a{
  color:#fff;
  text-decoration:none;
  margin-left:25px;
  font-size:11px;
  letter-spacing:2px;
}

.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at center,#45413a 0%,#171614 45%,#050505 100%);
}

.hero:after{
  content:"";
  position:absolute;
  width:700px;
  height:700px;
  border:1px solid rgba(212,177,105,.18);
  border-radius:50%;
}

.hero-content{
  position:relative;
  z-index:2;
  padding:30px;
}

.eyebrow{
  color:#d8b46a;
  letter-spacing:7px;
  font-size:12px;
}

.hero h1{
  font-size:clamp(60px,13vw,140px);
  letter-spacing:15px;
  font-weight:500;
  margin:18px 0;
}

.hero p{
  color:#cfcfcf;
  line-height:1.8;
  font-size:15px;
}

.btn{
  display:inline-block;
  margin-top:35px;
  padding:15px 32px;
  border:1px solid #c9a35c;
  color:#fff;
  text-decoration:none;
  letter-spacing:3px;
  font-size:11px;
  transition:.3s;
}

.btn:hover{
  background:#c9a35c;
  color:#111;
}

section{
  padding:110px 8%;
}

.dark{
  background:#0b0b0b;
}

.gold-section{
  background:#171512;
}

.heading{
  text-align:center;
  margin-bottom:65px;
}

.heading span{
  color:#c9a35c;
  letter-spacing:5px;
  font-size:11px;
}

.heading h2{
  font-size:44px;
  font-weight:400;
  margin-top:13px;
}

.about{
  max-width:1150px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:70px;
  align-items:center;
}

.fake-photo{
  height:520px;
  display:flex;
  align-items:end;
  padding:35px;
  background:
    linear-gradient(transparent,rgba(0,0,0,.8)),
    linear-gradient(135deg,#625b4e,#1d1b18);
  border:1px solid #3a352d;
}

.fake-photo span{
  color:#d8b46a;
  letter-spacing:3px;
  font-size:12px;
}

.about h3{
  font-size:38px;
  font-weight:400;
  margin-bottom:25px;
}

.about p{
  color:#aaa;
  line-height:2;
  font-size:15px;
  margin-bottom:18px;
}

.stats{
  display:flex;
  gap:40px;
  margin-top:35px;
}

.stat strong{
  display:block;
  font-size:28px;
  color:#d8b46a;
}

.stat small{
  color:#777;
  font-size:11px;
  letter-spacing:1px;
}

.cards{
  max-width:1150px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.card{
  min-height:360px;
  padding:30px;
  display:flex;
  align-items:end;
  border:1px solid #38342d;
  background:linear-gradient(145deg,#39352e,#111);
  transition:.4s;
}

.card:hover{
  transform:translateY(-8px);
  border-color:#c9a35c;
}

.card h3{
  font-size:26px;
  font-weight:400;
  margin-bottom:10px;
}

.card p{
  color:#999;
  line-height:1.7;
  font-size:13px;
}

.gallery{
  max-width:1150px;
  margin:auto;
  display:grid;
  grid-template-columns:2fr 1fr;
  grid-template-rows:250px 250px;
  gap:15px;
}

  display
